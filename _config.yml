# ============================================
# hexo-theme-shion Configuration
# ============================================

# --- Fonts ---
# Font families and base size. Leave empty to use theme SCSS defaults.
# External font loading (Google Fonts, CDN) must be handled by the user
# via custom_css or injecting <link> tags into the site header.
fonts:
  heading: "'Noto Serif SC', 'Source Han Serif SC', Georgia, serif"
  body: "'Noto Sans SC', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  code: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace"
  size_root: 15px

# --- Site Identity ---
favicon: /images/shion/favicon.png
logo:
  text: null
  image: null

# --- Navigation Menu ---
menu:
  Home: /
  Archives: /archives/
  Tags: /tags/
  Categories: /categories/
  Friends: /friends/
  About: /about/

# --- Header ---
header:
  nav_icons: true # show a 16px icon to the left of every nav item

# --- Appearance ---
appearance:
  default_mode: auto # auto | light | dark
  font_size: null # [deprecated] Use fonts.size_root instead
  code_theme: auto # auto | light | dark
  reading_progress: true # Show reading progress bar at top of page

# --- Home Page ---
home:
  posts_per_page: 10
  display_excerpt: true
  excerpt_length: 280
  sticky_badge: true

# --- Post ---
post:
  toc: true
  toc_max_depth: 3
  copyright: true
  reading_time: true
  word_count: true
  date_format: 'YYYY-MM-DD'
  cover:
    enable: true
    # Post by default uses cover.png inside its own asset folder (post_asset_folder).
    # Set this fallback only for posts without a cover file.
    default: /images/shion/default-cover.png
  share:
    enable: true
    # Same array-merge caveat as sidebar.widgets: the default list lives in the
    # template, so the site config can pick fewer platforms. Empty = all four.
    # platforms: ['twitter', 'facebook', 'linkedin', 'copy']
  copyright_license: 'CC BY-NC-SA 4.0'
  copyright_license_url: 'https://creativecommons.org/licenses/by-nc-sa/4.0/'
  code:
    highlight: highlight.js
    line_numbers: true
    copy_button: true
  math:
    enable: true
    engine: katex
    delimiters:
      - left: '$$'
        right: '$$'
        display: true
      - left: '$'
        right: '$'
        display: false
  image:
    lazy_load: true
    lightbox: true

# --- Sidebar ---
sidebar:
  enable: true
  position: left # left | right
  profile:
    enable: true
  avatar:
    enable: true
    image: /images/shion/avatar.png
  social:
    GitHub: https://github.com/
  # Widgets, in display order. Leave unset to get [recent-posts] (the template
  # supplies that default): Hexo *appends* arrays from _config.<theme>.yml to the
  # theme defaults instead of replacing them, so a default here would make it
  # impossible to drop or reorder it from the site config. Set [] for none.
  # widgets:
  #   - recent-posts
  recent_posts_count: 5
  tagcloud_min_font: 1.2
  tagcloud_max_font: 2.8
  # Per-layout sidebar overrides (higher priority than global, lower than page frontmatter)
  # Layout keys: index, archive, friends, categories, tags, about, page, post
  layouts: {}

# --- Music Player ---
music:
  enable: true
  playlist: []

# --- Comments ---
comments:
  enable: true
  # waline | giscus | disqus | twikoo | valine | gitalk | utterances | none
  # `none` renders nothing at all — useful for disabling comments on a branch.
  type: waline
  # Defer provider scripts until the comment section scrolls into view.
  lazy: true
  # Input placeholder for providers that support it (Waline, Valine).
  placeholder: ''
  # Waline client options are passed through to Waline.init().
  # The theme owns `el`, `dark`, `path` (default) and `lang` (auto).
  waline:
    serverURL: '' # e.g. https://waline.example.com
    lang: auto # auto | en | zh-CN | zh-TW | ja | ...
    # path: '' # defaults to location.pathname (recommended)
    # meta: ['nick', 'mail', 'link']
    # requiredMeta: ['nick']
    # login: enable # enable | disable | force
    # pageSize: 10
    # commentSorting: latest # latest | oldest | hottest
    # wordLimit: 0
    # noCopyright: false
    # noRss: false
    # imageUploader: false
    # search: false
    # reaction: false
    # emoji: ['//unpkg.com/@waline/emojis@1.4.0/weibo']
    # recaptchaV3Key: ''
    # turnstileKey: ''
    # locale: { placeholder: 'Leave a comment...' }
  giscus:
    repo: ''
    repo_id: ''
    category: ''
    category_id: ''
    mapping: pathname
    strict: false
    reactions_enabled: '1'
    emit_metadata: '0'
    input_position: top
    lang: auto
  disqus:
    shortname: ''
  twikoo:
    envId: ''
    # lang: auto
    # region: ap-shanghai
    # path: '' # defaults to location.pathname
  valine:
    appId: ''
    appKey: ''
    # lang: auto
    # path: '' # defaults to location.pathname
    # placeholder: ''
    # meta: ['nick', 'mail', 'link']
    # requiredFields: ['nick']
    # pageSize: 10
    # avatar: 'mp'
  gitalk:
    clientID: ''
    clientSecret: ''
    repo: ''
    owner: ''
    admin: []
    # id: '' # defaults to decodeURI(location.pathname)
    # title: '' # defaults to the page title
    # language: zh-CN
    # proxy: ''
    # distractionFreeMode: false
  utterances:
    repo: ''
    issue_term: pathname
    # label: ''

# --- Analytics ---
analytics:
  google: null
  baidu: null

# --- Search ---
search:
  enable: true
  type: local

# --- Footer ---
footer:
  since: null
  social: true # mirror sidebar.social under the footer info
  powered_by: true
  theme_by: true
  icp: null

# --- Site Uptime ---
# Live "running for X d X h X m X s" counter in the footer, counted from `since`.
# Accepts any date string a browser can parse; omit it (or set enable: false) to hide.
runtime:
  enable: true
  since: null # e.g. '2025-01-01T00:00:00'
  # Finest unit to display: day | hour | minute | second.
  # 'hour' renders "3 天 4 小时", 'day' renders "3 天".
  precision: day
  label: true # show the "Running for" lead-in
  icon: true # show the clock icon
  # Refresh interval in seconds. Empty = auto: tick exactly when the smallest
  # displayed unit changes (second -> 1 s, minute -> on the minute, ...).
  refresh: null

# --- Shion Theme Character ---
shion:
  hero_enable: true
  hero_image: /images/shion/hero.png
  background_image: /images/shion/bg.png
  404_image: /images/shion/404.png

# --- Hero Waves ---
# On non-post pages (home, archive, tag, category, regular pages) the hero
# becomes a banner that ends in animated waves, and the waves double as the
# divider above the content. Post pages keep their plain cover.
# Pure SVG + CSS — no JavaScript involved.
waves:
  enable: true
  # Restrict the band to specific non-post layouts. Leave empty (or omit)
  # to show it on all of them. Accepts: index, archive, categories
  # (or category), tags (or tag), page, and any custom page layout name.
  # layouts: [index, archive, categories, tags, page]
  hero_height: null # banner height (number = rem); defaults to min(60svh, 800px)
  height: null # water band height; defaults to clamp(3.125rem, 15svh, 9.375rem)
  amplitude: 0.64 # wave depth, as a fraction of the band height (0.2 – 0.71)
  layers: 4 # how many waves are stacked (2 – 8)
  depth_falloff: 0.45 # how much shallower the waves behind the shore are (1 = all equal)
  speed: 1 # 0.5 = half speed, 2 = double
  opacity: 1 # 0–1, opacity multiplier of the whole wave stack
  opacity_back: 0.2 # opacity of the furthest wave; the shore is always 1
  color: null # water colour; defaults to shore_color, i.e. the page background
  shore_color: null # page background colour the waves melt into (defaults to --color-bg-alt)

# --- Outdate Warning ---
outdate:
  enable: true
  days: 365

# --- Busuanzi ---
busuanzi:
  enable: false
  site_uv: true # Enable site UV (unique visitor) counter
  site_pv: true # Enable site PV (page view) counter
  page_pv: true # Enable per-post page view counter (shown in the post meta)

# --- Advanced ---
custom_css: null
custom_js: null
cdn:
  highlightjs: https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11
  katex: https://cdn.jsdelivr.net/npm/katex@0
  fusejs: https://cdn.jsdelivr.net/npm/fuse.js@7
